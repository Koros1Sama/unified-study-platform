<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="amber" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0b0e17" />
    <title>Study Viewer · المنصة الجامعية الموحدة</title>
    <meta name="description" content="المنصة الأكاديمية الشاملة والموحدة لجميع المقررات الدراسية — ملخصات، سلايدات، جداول مقارنة، وبنوك أسئلة متطورة" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="منصة المقررات" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update();
              let reloadPending = false;
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (window.__OFFLINE_DOWNLOADING__) {
                  reloadPending = true;
                  return;
                }
                window.location.reload();
              });
              window.addEventListener('offline-download-complete', () => {
                if (reloadPending) window.location.reload();
              });
            })
            .catch((err) => console.warn('Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
