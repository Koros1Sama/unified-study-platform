name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data bundles
        run: npm run build:data

      - name: Verify data and assets integrity
        run: npm run check:data

      - name: Typecheck & build platform
        env:
          VITE_BASE_PATH: "/"
          VITE_SLIDES_CDN_URL: ${{ secrets.R2_PUBLIC_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${VITE_SLIDES_CDN_URL:-}" ] && [ -d "public/slides" ]; then
            SAMPLE_SLIDE=$(find public/slides -type f -name '*.webp' ! -name '*.ar.webp' | head -n 1 || true)
            if [ -n "$SAMPLE_SLIDE" ]; then
              REL_PATH="${SAMPLE_SLIDE#public/}"
              if curl -fsI "${VITE_SLIDES_CDN_URL%/}/${REL_PATH}" >/dev/null 2>&1; then
                echo "Verified R2 CDN serves ${REL_PATH} — pruning public/slides from CI runner to keep Vercel deploy <5MB"
                rm -rf public/slides
              else
                echo "R2 CDN not yet populated for ${REL_PATH} — keeping local public/slides for this deploy"
              fi
            fi
          fi
          npm run build

      - name: Deploy prebuilt dist to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VITE_BASE_PATH: "/"
          VITE_SLIDES_CDN_URL: ${{ secrets.R2_PUBLIC_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "Connecting to Vercel API..."
          PROJ_RES=$(curl -s -X POST "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name": "unified-study-platform", "framework": "vite"}')
          PROJ_ID=$(echo "$PROJ_RES" | jq -r '.id // empty')
          if [ -z "$PROJ_ID" ]; then
            PROJ_RES=$(curl -s "https://api.vercel.com/v9/projects/unified-study-platform?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            PROJ_ID=$(echo "$PROJ_RES" | jq -r '.id // empty')
          fi
          if [ -z "$PROJ_ID" ] || [ "$PROJ_ID" = "null" ]; then
            echo "Failed to resolve Vercel project ID: $PROJ_RES"
            exit 1
          fi
          echo "Vercel Project ID: $PROJ_ID"
          export VERCEL_PROJECT_ID="$PROJ_ID"
          mkdir -p .vercel
          echo "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${PROJ_ID}\"}" > .vercel/project.json
          npx --yes vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
          npx --yes vercel build --prod --token="${VERCEL_TOKEN}"
          npx --yes vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}" --yes
