name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data bundles
        run: npm run build:data

      - name: Build platform
        env:
          VITE_BASE_PATH: "/"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          echo "Connecting to Vercel API..."
          PROJ_RES=$(curl -s -X POST "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name": "unified-study-platform", "framework": "vite"}')
          PROJ_ID=$(echo "$PROJ_RES" | jq -r '.id // empty')
          if [ -z "$PROJ_ID" ]; then
            PROJ_RES=$(curl -s "https://api.vercel.com/v9/projects/unified-study-platform?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            PROJ_ID=$(echo "$PROJ_RES" | jq -r '.id')
          fi
          echo "Vercel Project ID: $PROJ_ID"
          export VERCEL_PROJECT_ID="$PROJ_ID"
          mkdir -p .vercel
          echo "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${PROJ_ID}\"}" > .vercel/project.json
          npx --yes vercel deploy --prod --token="${VERCEL_TOKEN}" --yes
