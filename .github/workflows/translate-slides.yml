name: Cloud Slides R2 Sync & Arabic Lens Translation

on:
  push:
    branches: ["master"]
    paths:
      - "public/slides/**"
      - "public/data/subjects.json"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject code filter (leave empty for all, e.g. toc, sec, phy)"
        required: false
        default: ""
      sync_originals:
        description: "Sync original slides to Cloudflare R2"
        type: boolean
        default: true
      translate:
        description: "Translate foreign-language slides to Arabic via Google Lens"
        type: boolean
        default: true
      force:
        description: "Force re-translation even if cached in manifest"
        type: boolean
        default: false
      max_slides:
        description: "Optional max slides to translate in this run (0 = all)"
        required: false
        default: "0"

concurrency:
  group: "r2-slides-pipeline"
  cancel-in-progress: false

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Arabic fonts & libraqm for crisp RTL rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libraqm0 libfribidi0 libharfbuzz0b fonts-noto-core curl
          mkdir -p /usr/share/fonts/truetype/cairo || sudo mkdir -p /usr/share/fonts/truetype/cairo
          sudo curl -fsSL "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-SemiBold.ttf" \
            -o /usr/share/fonts/truetype/cairo/Cairo-SemiBold.ttf || true

      - name: Install Python dependencies (Online Lens + R2 S3)
        run: |
          python -m pip install --upgrade pip
          pip install "chrome-lens-py>=4.0.0" "Pillow>=10.3.0" "boto3>=1.34.0" "arabic-reshaper>=3.0.0" "python-bidi>=0.4.2"

      - name: Run R2 Sync & Cloud Google Lens Translation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.subject }}" ]; then
              ARGS+=(--subject "${{ inputs.subject }}")
            fi
            if [ "${{ inputs.sync_originals }}" = "true" ]; then
              ARGS+=(--sync-originals)
            fi
            if [ "${{ inputs.translate }}" = "true" ]; then
              ARGS+=(--translate)
            fi
            if [ "${{ inputs.force }}" = "true" ]; then
              ARGS+=(--force)
            fi
            if [ "${{ inputs.max_slides }}" != "0" ] && [ -n "${{ inputs.max_slides }}" ]; then
              ARGS+=(--max-slides "${{ inputs.max_slides }}")
            fi
          else
            ARGS+=(--sync-originals --translate)
          fi
          python scripts/translate_slides.py "${ARGS[@]}"
